name: Compile ASEPicker
on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevents one failure from cancelling the rest
      matrix:
        # Pinned to stable OS versions to support Python 3.7 compilation
        os: [windows-2022, ubuntu-22.04]
        python-version: ["3.7", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Upgraded to v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5 # Upgraded to v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: python -m pip install --upgrade pip setuptools cython wheel

      - name: Compile C-Extensions
        run: python setup.py build_ext --inplace

      - name: Clean up temporary C files
        run: |
          rm ASEPicker/*.c 2>/dev/null || true
        shell: bash

      - name: Organize Binaries
        run: |
          # 1. Strip the messy CPython architecture tags (e.g., main.cp310-win_amd64.pyd -> main.pyd)
          python -c "import os, glob; [os.rename(f, os.path.join(os.path.dirname(f), os.path.basename(f).split('.')[0] + '.' + f.split('.')[-1])) for f in glob.glob('ASEPicker/*.pyd') + glob.glob('ASEPicker/*.so')]"
          
          # 2. Create the folders and move the clean files
          mkdir -p build_output/py${{ matrix.python-version }}
          mv ASEPicker/*.pyd build_output/py${{ matrix.python-version }}/ 2>/dev/null || true
          mv ASEPicker/*.so build_output/py${{ matrix.python-version }}/ 2>/dev/null || true
        shell: bash

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4 # Upgraded to v4
        with:
          name: ASEPicker-Binaries-${{ matrix.os }}-Py${{ matrix.python-version }}
          path: build_output/
